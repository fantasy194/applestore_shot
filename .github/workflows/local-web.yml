name: Local Web packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: mac-arm64
          - os: macos-15-intel
            label: mac-x64
          - os: windows-latest
            label: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.9.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: local-web
      - run: pnpm install --frozen-lockfile
      - run: python scripts/setup_worker.py
      - run: cargo test --locked --manifest-path local-web/Cargo.toml
      - run: python -m unittest discover -s tests/local_web -p "test_*.py"
      - run: pnpm build:web
      - run: pnpm exec playwright install chromium
      - run: pnpm test:dev:web
      - name: Archive package (preserves macOS executable permissions)
        shell: bash
        run: tar -czf local-web-${{ matrix.label }}.tar.gz local-web-release
      - uses: actions/upload-artifact@v4
        with:
          name: duo-killer-local-web-${{ matrix.label }}
          path: local-web-${{ matrix.label }}.tar.gz
