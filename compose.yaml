name: iphoneduo

services:
  app:
    image: ${APP_IMAGE:-iphoneduo:local}
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    shm_size: 1gb
    security_opt:
      - seccomp=./docker/chrome-seccomp.json
    ports:
      - "${DUO_WEB_BIND:-127.0.0.1}:${DUO_WEB_PORT:-17654}:${DUO_WEB_PORT:-17654}"
    environment:
      DUO_BROWSER_SOCKET: /data/.browser-control/control.sock
      DUO_WEB_PORT: ${DUO_WEB_PORT:-17654}
      DUO_WEB_PASSWORD: ${DUO_WEB_PASSWORD:-}
      DUO_WEB_ALLOWED_ORIGINS: ${DUO_WEB_ALLOWED_ORIGINS:-}
      DUO_WEB_TRUST_NETWORK: ${DUO_WEB_TRUST_NETWORK:-0}
      DUO_WEB_DISABLE_TUNNEL: ${DUO_WEB_DISABLE_TUNNEL:-1}
      TZ: Asia/Shanghai
    volumes:
      - app-data:/data
    depends_on:
      browser:
        condition: service_healthy
    networks:
      default:
        aliases:
          - duo-app

  browser:
    hostname: duo-browser
    image: ${BROWSER_IMAGE:-${APP_IMAGE:-iphoneduo:local}-browser}
    build:
      context: .
      dockerfile: docker/Dockerfile.browser
    restart: unless-stopped
    stop_grace_period: 20s
    shm_size: 1gb
    security_opt:
      - seccomp=./docker/chrome-seccomp.json
    environment:
      USER_ID: "1000"
      GROUP_ID: "1000"
      TZ: Asia/Shanghai
    volumes:
      - app-data:/data

volumes:
  app-data:
