[package]
name = "duo-killer"
version = "0.1.13"
edition = "2021"
description = "DUO Killer multi-account desktop client"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# uuid 1.27 requires Rust 1.89; keep compatibility with Rust 1.88.
uuid = { version = "=1.26.0", features = ["v4", "serde"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
base64 = "0.22"
reqwest = { version = "0.13", default-features = false }
tempfile = "3"
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"

# Xcode 27 dyld rejects some proc-macro dylibs stripped by Rust/LLVM.
# https://github.com/rust-lang/rust/issues/157750
[profile.release]
strip = "none"

[profile.release.build-override]
strip = "none"

[profile.dev.build-override]
strip = "none"
